    Deverakonda Vijay Sai (born 9 May 1989), widely known as Vijay Deverakonda,[1] is an Indian actor and film producer who works in Telugu films.[2][3] Vijay is the recipient of a Filmfare Award, a Nandi Award and three SIIMA Awards.[4]
